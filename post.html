        function renderComments(comments) {
            const list  = document.getElementById('comments-list');
            const count = document.getElementById('comment-count');
            const metaCount = document.getElementById('meta-comment-count');
            if (!list) return;
            if (count) count.textContent = `(${comments.length})`;
            if (metaCount) metaCount.textContent = `(${comments.length})`;
            if (comments.length === 0) {
                list.innerHTML = '<div class="comment-empty">No comments yet. Be the first!</div>';
                return;
            }

            const byParent = new Map();
            const ids = new Set(comments.map(c => String(c.id)));
            comments.forEach(comment => {
                const parentKey = comment.parentId && ids.has(String(comment.parentId)) ? String(comment.parentId) : '';
                if (!byParent.has(parentKey)) byParent.set(parentKey, []);
                byParent.get(parentKey).push(comment);
            });

            let avatarIndex = 0;
            const renderThread = (parentId, depth) => {
                const replies = (byParent.get(parentId) || []).slice().sort(commentSortFn);
                return replies.map(comment => {
                    avatarIndex++;
                    const children = byParent.has(String(comment.id))
                        ? renderThread(String(comment.id), depth + 1)
                        : '';
                    const nested = children && depth < 3
                        ? `<div class="comment-replies">${children}</div>`
                        : '';
                    return commentCardHtml(comment, avatarIndex) + nested;
                }).join('');
            };

            list.innerHTML = renderThread('', 0);
        }

        function setReplyTarget(commentId) {
            const comment = commentsCache.find(c => String(c.id) === String(commentId));
            if (!comment) return;
            replyTarget = { id: String(comment.id), name: comment.name || 'this comment' };
            const context = document.getElementById('reply-context');
            const label = document.getElementById('reply-context-label');
            if (label) label.textContent = `Replying to ${replyTarget.name}`;
            if (context) context.classList.add('show');
            const modal = document.getElementById('comments-modal');
            if (modal && !modal.classList.contains('show')) toggleCommentsSection();
            const textarea = document.getElementById('modal-comment-input');
            if (textarea) {
                textarea.placeholder = `Reply to ${replyTarget.name}…`;
                textarea.focus();
            }
        }

        function clearReplyTarget() {
            replyTarget = null;
            const context = document.getElementById('reply-context');
            if (context) context.classList.remove('show');

        async function toggleCommentPin(commentId, btn) {
            try {
                const headers = { 'Content-Type': 'application/json' };
                const token = sessionStorage.getItem('authToken');
                if (token) headers.Authorization = 'Bearer ' + token;
                const resp = await fetch(`/api/posts/${postId}/comments/${commentId}/pin`, {
                    method: 'POST',
                    credentials: 'include',
                    headers,
                    body: '{}'
                });
                const data = await resp.json();
                if (!resp.ok) {
                    showToast(data.error || 'Could not pin this comment.');
                    return;
                }
                const comment = commentsCache.find(c => String(c.id) === String(commentId));
                if (comment) comment.pinned = !!data.pinned;
                renderComments(commentsCache);
                showToast(data.pinned ? 'Comment pinned.' : 'Comment unpinned.');
            } catch (e) {
                console.error('Pin error:', e);
                showToast('Could not pin this comment.');

        async function toggleCommentLike(btn, postId, commentId, type) {
            try {
                const key = `clr_${postId}_${commentId}_${type}`;
                const isActive = localStorage.getItem(key);
                const action = isActive ? 'remove' : 'add';
                const r = await fetch(`/api/posts/${postId}/comments/${commentId}/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });
                if (r.ok) {
                    const numEl = btn.querySelector(`.${type}-num`);
                    const cur   = parseInt(numEl.textContent) || 0;
                    numEl.textContent = action === 'add' ? cur + 1 : Math.max(0, cur - 1);

                    else localStorage.removeItem(key);

            const name    = (document.getElementById('modal-name-input')?.value || '').trim();
            const email   = (document.getElementById('modal-email-input')?.value || '').trim();
            const content = (document.getElementById('modal-comment-input')?.value || '').trim();
            const subscribe = !!(document.getElementById('modal-subscribe')?.checked);
            if (!name || !content) { alert('Please enter your name and comment.'); return; }

            const btn = document.querySelector('.comments-modal-footer .submit-btn');

            if (btn) { btn.disabled = true; btn.textContent = 'Posting…'; }

            try {
                const fd = new FormData();
                fd.append('name', name); fd.append('email', email); fd.append('content', content);
                if (replyTarget) fd.append('parentId', replyTarget.id);
                if (subscribe) fd.append('subscribe', '1');
                const r = await fetch(`/api/posts/${postId}/comments`, { method: 'POST', body: fd });
                const d = await r.json();
                if (d.success) {
                    document.getElementById('modal-name-input').value = '';
                    document.getElementById('modal-email-input').value = '';
                    document.getElementById('modal-comment-input').value = '';
                    document.getElementById('modal-subscribe').checked = false;
                    clearReplyTarget();

            finally { if (btn) { btn.disabled = false; btn.textContent = orig; } }
        }

        function copyLink() {
            const done = () => showToast('Link copied to clipboard.');
            const fallback = () => {
                const t = document.createElement('textarea');
                t.value = window.location.href;
                document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);
                done();
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(window.location.href).then(done).catch(fallback);

                fallback();

        let heroHeight = 0;

        function onScroll() {
            const scrollTop  = window.pageYOffset || document.documentElement.scrollTop;
            const docHeight  = document.documentElement.scrollHeight - window.innerHeight;
            const percent    = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;

            const bar = document.getElementById('reading-progress-bar');
            if (bar) bar.style.width = percent + '%';

            if (postId && percent > 0) {
                storeScrollPosition(percent);
                const resumePill = document.getElementById('resume-pill');
                if (resumePill && percent > 2) resumePill.classList.remove('visible');
                try {
                    const prog = JSON.parse(localStorage.getItem('blog_reading_progress') || '{}');
                    const prev = prog[postId] || 0;
                    if (percent > prev) { prog[postId] = Math.round(percent); localStorage.setItem('blog_reading_progress', JSON.stringify(prog)); }
                } catch {}
            }

            // Reading time countdown pill (uses the same total as the hero badge)
            const pill = document.getElementById('read-time-pill');
            if (pill && globalTotalMins) {
                const totalMins = globalTotalMins;
                const remaining = Math.max(0, Math.round(totalMins * (1 - percent / 100)));
                if (percent >= 98) {
                    pill.textContent = '\u2713 Done!';
                    pill.classList.add('done');
                    pill.classList.add('visible');
                } else if (percent > 8) {
                    pill.textContent = remaining <= 1 ? '< 1 min left' : `${remaining} min left`;
                    pill.classList.remove('done');
                    pill.classList.add('visible');
                } else {
                    pill.classList.remove('visible');
                }
            }

            const stickyHeader = document.getElementById('sticky-header');
            if (heroHeight === 0) {
                const hero = document.querySelector('.post-hero');
                if (hero) heroHeight = hero.offsetHeight;
            }
            if (stickyHeader) stickyHeader.classList.toggle('visible', scrollTop > heroHeight * 0.6);

            const sideShare = document.getElementById('side-share');
            if (sideShare) sideShare.classList.toggle('visible', scrollTop > heroHeight * 0.8);
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('load', onScroll);

        // Prev/next pager — driven by the API so it works without a full-list fetch
        function renderPostNav() {
            const nav = document.getElementById('post-nav');
            if (!nav || !postNavData) return;
            const { prev, next } = postNavData;
            if (!prev && !next) { nav.hidden = true; return; }

            const link = (p, dir) => {
                if (!p) return '<span class="post-nav-slot"></span>';
                const label = dir === 'prev' ? '← Previous' : 'Next →';
                return `
                    <a class="post-nav-link post-nav-${dir}" href="/post.html?id=${encodeURIComponent(p.id)}">
                        <span class="post-nav-dir">${label}</span>
                        <span class="post-nav-title">${escapeHtml(p.title)}</span>
                    </a>`;
            };
            nav.innerHTML = link(prev, 'prev') + link(next, 'next');
            nav.hidden = false;
        }

        async function loadRelatedPosts(currentPost) {
            const section = document.getElementById('related-posts-section');
            if (!section) return;
            try {
                let top;
                if (Array.isArray(postNavData && postNavData.related)) {
                    // Server-computed related posts (summaries) — no extra fetch
                    top = postNavData.related;
                } else {
                    const resp = await fetch('/api/posts');
                    const data = await resp.json();
                    const allPosts = (data.posts || []).filter(p => p.id !== currentPost.id);
                    if (allPosts.length === 0) { section.style.display = 'none'; return; }

                    // Score by shared tags + same category, fall back to recency
                    const scored = allPosts.map(p => {
                        let score = 0;
                        const curTags = currentPost.tags || [];
                        (p.tags || []).forEach(t => { if (curTags.includes(t)) score += 2; });
                        if (p.categoryId && p.categoryId === currentPost.categoryId) score += 1;
                        return { post: p, score };
                    });
                    scored.sort((a, b) => b.score - a.score || new Date(b.post.date) - new Date(a.post.date));
                    top = scored.slice(0, 3).map(s => s.post);
                }
                if (!top || top.length === 0) { section.style.display = 'none'; return; }

                const cards = top.map(p => {
                    const img = (p.images && p.images[0]) || p.image || '';
                    const rt  = p.readingMinutes || Math.max(1, Math.ceil(((p.content || '').trim().split(/\s+/).length) / 200));
                    const dt  = new Date(p.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    const ex  = p.excerpt || ((p.content || '').replace(/<[^>]+>/g, '').substring(0, 110).trim() + '\u2026');
                    return `
                        <a href="/post.html?id=${p.id}" class="rp-card">
                            <div class="rp-card-img">
                                ${img ? `<img src="${img}" alt="${p.title}" loading="lazy" decoding="async" onerror="this.onerror=null;this.outerHTML='<div class=\\'rp-card-img-ph\\'></div>'">` : '<div class="rp-card-img-ph"></div>'}
                                <span class="rp-card-rt">\u23f1 ${rt} min</span>
                            </div>
                            <div class="rp-card-body">
                                ${p.categoryName ? `<span class="rp-card-cat">${p.categoryName}</span>` : ''}
                                <h3 class="rp-card-title">${p.title}</h3>
                                <p class="rp-card-excerpt">${ex}</p>
                                <span class="rp-card-date">${dt}</span>
                            </div>
                        </a>`;
                }).join('');

                section.innerHTML = `
                    <div class="related-posts-inner">
                        <div class="related-posts-header">
                            <span class="related-posts-label">Continue Reading</span>
                            <div class="related-posts-line"></div>
                        </div>
                        <div class="related-posts-grid">${cards}</div>
                    </div>`;
            } catch (e) {
                console.error('Related posts error:', e);
                section.style.display = 'none';
            }
        }

        function focusReply() {
            const ta = document.getElementById('modal-comment-input') || document.getElementById('comment-input');
            if (ta) { ta.focus(); ta.placeholder = 'Write your reply…'; ta.scrollIntoView({ behavior:'smooth', block:'center' }); }
        }

        let lightboxSet = [];
        let lightboxIndex = 0;

        function updateLightboxState() {
            const lb = document.getElementById('lightbox');
            const counter = document.getElementById('lightbox-counter');
            const multiple = lightboxSet.length > 1;
            if (lb) lb.classList.toggle('has-set', multiple);
            if (counter) counter.textContent = multiple ? `${lightboxIndex + 1} / ${lightboxSet.length}` : '';
        }

        function openLightbox(imgUrl, set, label) {
            const lb   = document.getElementById('lightbox');
            const img  = document.getElementById('lightbox-img');
            const name = document.getElementById('lightbox-author-name');
            if (!lb || !img) return;

            lightboxSet = Array.isArray(set) ? set.filter(Boolean) : [];
            lightboxIndex = Math.max(0, lightboxSet.indexOf(imgUrl));
            img.src = imgUrl;
            if (name) {
                if (label) name.textContent = label;
                else name.textContent = globalAuthorInfo ? (globalAuthorInfo.name || 'Author') : '';
            }
            updateLightboxState();
            lb.classList.add('active');
        }

        function stepLightbox(delta) {
            if (lightboxSet.length < 2) return;
            lightboxIndex = (lightboxIndex + delta + lightboxSet.length) % lightboxSet.length;
            const img = document.getElementById('lightbox-img');
            if (img) img.src = lightboxSet[lightboxIndex];
            updateLightboxState();
        }

        function openCommentLightbox(src) {
            const lb  = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            const n   = document.getElementById('lightbox-author-name');
            if (lb && img) {
                lightboxSet = [];
                lightboxIndex = 0;
                img.src = src;
                if (n) n.textContent = 'Comment Photo';
                updateLightboxState();
                lb.classList.add('active');
            }
        }
        function closeLightbox(event) {
            if (event && event.target.id !== 'lightbox' && !event.target.classList.contains('lightbox-close')) return;
            const lb = document.getElementById('lightbox');
            if (lb) lb.classList.remove('active');
            lightboxSet = [];
            lightboxIndex = 0;
            updateLightboxState();
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                const modal = document.getElementById('comments-modal');
                if (modal && modal.classList.contains('show')) {
                    toggleCommentsSection();
                    return;
                }
            }
            const lb = document.getElementById('lightbox');
            if (!lb || !lb.classList.contains('active')) return;
            if (event.key === 'Escape') closeLightbox();
            else if (event.key === 'ArrowRight') stepLightbox(1);
            else if (event.key === 'ArrowLeft') stepLightbox(-1);
        });

        function showError(message) {
            document.getElementById('post-root').innerHTML = `
                <div class="error" style="background:var(--navy);min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                    <h2>Post Not Found</h2>
                    <p style="color:rgba(255,255,255,0.5);margin-top:8px;">${message}</p>
                    <button onclick="goBack()" style="margin-top:24px;font-family:var(--sans);padding:10px 24px;background:var(--red);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;">← Back to Blog</button>
                </div>`;
        }
        function goBack() { window.location.href = '/'; }

        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            document.querySelectorAll('.site-nav a').forEach(link => {
                const href = link.getAttribute('href');
                if (href && href !== '/' && path.includes(href.replace('/','').replace('.html',''))) link.classList.add('active');
            });
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            }
        });
    </script>
</body>
</html>
