<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blog Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --violet: #7c3aed;
            --ring: rgba(99, 102, 241, 0.15);
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-medium: #64748b;
            --error-color: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 20px 50px rgba(99, 102, 241, 0.15), 0 8px 16px -8px rgb(0 0 0 / 0.08);
            --border-radius: 20px;
            --transition: all 0.2s ease-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(circle at 20% 10%, #e0e7ff 0%, #f8fafc 45%, #ede9fe 100%);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Soft blurred shapes behind the card */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.5;
            pointer-events: none;
            z-index: -1;
        }
        .bg-blob-1 {
            width: 380px; height: 380px;
            top: -120px; left: -100px;
            background: radial-gradient(circle, rgba(99,102,241,0.35), transparent 70%);
        }
        .bg-blob-2 {
            width: 420px; height: 420px;
            bottom: -160px; right: -120px;
            background: radial-gradient(circle, rgba(124,58,237,0.3), transparent 70%);
        }

        .login-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            border: 1px solid rgba(99, 102, 241, 0.12);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 380px;
            transform: translateY(0);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .login-header p {
            color: var(--text-medium);
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .forgot-password-form {
            display: none;
            margin-top: 20px;
        }

        .forgot-password-form .form-group {
            margin-bottom: 16px;
        }

        /* Forgot password link — small, right-aligned under the password field */
        .forgot-password-row {
            display: flex;
            justify-content: flex-end;
            margin-top: -18px;
        }

        .forgot-password {
            text-align: right;
        }

        .forgot-password a {
            color: var(--text-medium);
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            transition: var(--transition);
        }

        .forgot-password a:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        /* Visible labels above inputs */
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: 0.01em;
            pointer-events: none;
        }

        .input-wrap {
            position: relative;
            width: 100%;
        }

        .form-input {
            padding: 0 16px;
            height: 52px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-dark);
            transition: border-color .15s, box-shadow .15s;
            background: #f8fafc;
            width: 100%;
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--ring);
            background: #ffffff;
        }

        /* Global focus-visible ring for keyboard users */
        :focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        .form-input:focus-visible {
            outline: none;
        }

        /* Inline field validation error */
        .field-error {
            display: none;
            color: var(--error-color);
            font-size: 12.5px;
            font-weight: 500;
            margin-top: 2px;
        }

        .form-group.has-error .form-input {
            border-color: var(--error-color);
        }

        .form-group.has-error .field-error {
            display: block;
        }

        .login-container.shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Remember me row */
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: -8px;
            font-size: 13.5px;
            color: var(--text-medium);
            user-select: none;
        }

        .remember-me input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .remember-me label {
            cursor: pointer;
        }

        /* Gradient Sign In button */
        .login-btn {
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            color: white;
            border: none;
            padding: 0 24px;
            height: 52px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform .15s, box-shadow .15s;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.35);
        }

        .login-btn:disabled {
            background: var(--text-medium);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Full-width outlined Google button — same height as Sign In */
        .google-btn {
            width: 100%;
            background: #ffffff;
            color: var(--text-dark);
            border: 1px solid #e2e8f0;
            padding: 0 24px;
            height: 52px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: border-color .15s, background .15s, transform .15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 0;
        }

        .google-btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .google-btn:disabled {
            cursor: not-allowed;
            transform: none;
            opacity: 0.8;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: var(--text-medium);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .divider::after {
            content: '';
            height: 0;
            background: #e9ecef;
            border-top: 1px solid #e2e8f0;
            flex: 1;
        }

        .divider span {
            background: var(--card-bg);
            padding: 0 4px;
            font-size: 13px;
        }

        .error-message {
            background: #fef2f2;
            color: var(--error-color);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #fee2e2;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }

        .back-link a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-medium);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }

        .back-link a .arrow {
            transition: transform 0.2s ease;
        }

        .back-link a:hover {
            color: var(--primary-color);
        }

        .back-link a:hover .arrow {
            transform: translateX(-4px);
        }

        .forgot-password-form {
            display: none;
            margin-top: 20px;
        }

        .forgot-password-form .form-group {
            margin-bottom: 16px;
        }

        /* Right-aligned password visibility toggle inside .input-wrap */
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-medium);
            transition: var(--transition);
            padding: 4px;
            line-height: 0;
            z-index: 10;
        }

        .password-toggle:hover {
            color: var(--text-dark);
        }

        /* License Login Toggle — segmented control with sliding pill */
        .login-mode-toggle {
            position: relative;
            display: flex;
            margin-bottom: 20px;
            padding: 4px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        .login-mode-indicator {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: calc(50% - 4px);
            background: #ffffff;
            border-radius: 9px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12), 0 1px 2px rgba(15, 23, 42, 0.08);
            transition: transform 0.25s ease;
            z-index: 0;
        }

        .login-mode-toggle.license .login-mode-indicator {
            transform: translateX(100%);
        }

        .login-mode-btn {
            position: relative;
            flex: 1;
            padding: 9px 12px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: var(--text-medium);
            cursor: pointer;
            transition: color 0.2s;
            border-radius: 9px;
            z-index: 1;
        }

        .login-mode-btn.active {
            color: var(--text-dark);
        }

        .login-mode-btn:not(.active):hover {
            color: var(--text-dark);
        }

        .license-form {
            display: none;
        }

        .license-form.visible {
            display: block;
        }

        .normal-form.hidden {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
            .login-header h1 {
                font-size: 24px;
            }
            .login-btn,
            .google-btn {
                min-height: 52px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 24px;
            }
        }

        @media (max-width: 360px) {
            .login-container {
                padding: 20px;
            }
            .login-header h1 {
                font-size: 20px;
            }
            .login-header p {
                font-size: 13px;
            }
        }

        @supports (padding: env(safe-area-inset-bottom)) {
            .admin-key-overlay {
                padding-bottom: calc(20px + env(safe-area-inset-bottom));
            }
        }

        /* Admin Entry Key Gate (blocks access to login page) */
        .admin-key-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(10px);
            z-index: 9999;
            padding: 20px;
        }

        .admin-key-card {
            width: 100%;
            max-width: 360px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            padding: 20px;
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        .admin-key-card h2 {
            margin: 0 0 8px;
            font-size: 16px;
            color: var(--text-dark);
            letter-spacing: -0.02em;
        }

        .admin-key-card p {
            margin: 0 0 18px;
            color: var(--text-medium);
            font-size: 12.5px;
        }

        .admin-key-error {
            display: none;
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: var(--error-color);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .admin-key-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .admin-key-help {
            font-size: 12px;
            color: var(--text-medium);
            margin-top: 8px;
            line-height: 1.3;
        }

        .admin-key-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .admin-key-input-wrap {
            position: relative;
            width: 100%;
        }

        .admin-key-input {
            width: 100%;
            padding: 12px 44px 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            background: #f8fafc;
        }

        .admin-key-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
            background: #ffffff;
        }

        .admin-key-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #ffffff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-medium);
            transition: var(--transition);
        }

        .admin-key-toggle:hover {
            color: var(--text-dark);
            border-color: #cbd5e1;
        }

        .admin-key-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .admin-key-actions button {
            flex: 1;
        }
    </style>
</head>

<body>
    <!-- Soft background shapes -->
    <div class="bg-blob bg-blob-1" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-2" aria-hidden="true"></div>

    <!-- Admin Entry Key Gate -->
    <div class="admin-key-overlay" id="adminKeyOverlay" aria-hidden="true">
        <div class="admin-key-card" role="dialog" aria-modal="true" aria-labelledby="adminKeyTitle">
            <h2 id="adminKeyTitle">Subscriber ID Required</h2>
            
            <div class="admin-key-error" id="adminKeyError"></div>

            <div class="admin-key-field">
                <div class="admin-key-label" id="adminKeyLabel">Subscriber ID</div>
                <div class="admin-key-input-wrap">
                    <input class="admin-key-input" id="adminKeyInput" type="password" placeholder="Enter subscriber ID"
                        autocomplete="off" maxlength="200" aria-labelledby="adminKeyLabel" />
                    <button class="admin-key-toggle" id="adminKeyToggle" type="button" aria-label="Show subscriber ID"
                        title="Show/Hide">
                        <svg id="adminKeyToggleIcon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="admin-key-actions">
                <button class="login-btn" id="adminKeyUnlockBtn" type="button">Unlock</button>
                <button class="google-btn" id="adminKeyCancelBtn" type="button">Cancel</button>
            </div>
        </div>
    </div>

    <div class="login-container" id="loginContainer" style="display:none;">
        <div class="login-header">
            <div class="brand-icon" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2l7 3v6c0 4.97-2.98 8.68-7 10-4.02-1.32-7-5.03-7-10V5l7-3z"></path>
                    <path d="M12 11v4"></path>
                    <path d="M9.5 12.5h5"></path>
                </svg>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to access the admin panel</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <!-- Login Mode Toggle (segmented control) -->
        <div class="login-mode-toggle" id="loginModeToggle">
            <span class="login-mode-indicator" aria-hidden="true"></span>
            <button type="button" class="login-mode-btn active" id="adminModeBtn" onclick="switchLoginMode('admin')">Admin Login</button>
            <button type="button" class="login-mode-btn" id="licenseModeBtn" onclick="switchLoginMode('license')">Template License</button>
        </div>

        <!-- Admin Login Form -->
        <form class="login-form normal-form" id="loginForm" novalidate>
            <div class="form-group" id="usernameGroup">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Enter your username" required
                    autocomplete="username" maxlength="100">
                <div class="field-error" id="usernameError"></div>
            </div>

            <div class="form-group" id="passwordGroup">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required
                        autocomplete="current-password" maxlength="200" style="padding-right: 48px;">
                    <button type="button" class="password-toggle" id="passwordToggle"
                        aria-label="Show password" title="Show password">
                        <svg id="passwordToggleIcon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="field-error" id="passwordError"></div>
                <div class="forgot-password-row">
                    <div class="forgot-password" id="forgotPasswordContainer">
                        <a href="#" id="forgotPasswordLink">Forgot your password?</a>
                    </div>
                </div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe" checked>
                <label for="rememberMe">Remember me</label>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span>Sign In</span>
            </button>
        </form>

        <form class="forgot-password-form" id="forgotPasswordForm" novalidate>
            <div class="form-group" id="resetEmailGroup">
                <label for="resetEmail" class="form-label">Email Address</label>
                <input type="email" id="resetEmail" class="form-input" placeholder="you@example.com" required
                    autocomplete="email">
                <div class="field-error" id="resetEmailError"></div>
            </div>
            <button type="submit" class="login-btn" id="resetBtn">Send Reset Email</button>
            <div class="forgot-password" style="margin-top: 12px;">
                <a href="#" id="backToLoginLink">← Back to Login</a>
            </div>
        </form>

        <div class="divider" id="signInDivider">
            <span>or</span>
        </div>

        <button class="google-btn" id="googleBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                <path fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Sign in with Google
        </button>

        <!-- License Key Login Form (hidden by default) -->
        <form class="login-form license-form" id="licenseLoginForm" novalidate>
            <div class="form-group" id="licenseEmailGroup">
                <label for="licenseEmail" class="form-label">Email Address</label>
                <input type="email" id="licenseEmail" class="form-input" placeholder="you@example.com" required
                    autocomplete="email">
                <div class="field-error" id="licenseEmailError"></div>
            </div>
            <div class="form-group" id="licenseKeyGroup">
                <label for="licenseKey" class="form-label">License Key (BLG-XXXX-XXXX-XXXX)</label>
                <input type="text" id="licenseKey" class="form-input" placeholder="BLG-XXXX-XXXX-XXXX" required
                    autocomplete="off" maxlength="30" style="text-transform:uppercase; letter-spacing:0.05em;">
                <div class="field-error" id="licenseKeyError"></div>
            </div>
            <button type="submit" class="login-btn" id="licenseLoginBtn">
                <span>Activate with License</span>
            </button>
            <p style="font-size:12px;color:var(--text-medium);text-align:center;margin-top:12px;">
                Don't have a license? <a href="/" style="color:var(--primary-color);font-weight:500;">Get the template</a>
            </p>
        </form>

        <div class="back-link">
            <a href="/"><span class="arrow" aria-hidden="true">←</span> Back to Blog</a>
        </div>
    </div>

    <script>
        // ------------------------------------------------------------
        // Admin Entry Key gate (runs BEFORE showing the login UI)
        // ------------------------------------------------------------
        const loginContainerEl = document.getElementById('loginContainer');
        const adminKeyOverlayEl = document.getElementById('adminKeyOverlay');
        const adminKeyInputEl = document.getElementById('adminKeyInput');
        const adminKeyUnlockBtn = document.getElementById('adminKeyUnlockBtn');
        const adminKeyCancelBtn = document.getElementById('adminKeyCancelBtn');
        const adminKeyErrorEl = document.getElementById('adminKeyError');
        const adminKeyToggleBtn = document.getElementById('adminKeyToggle');
        const adminKeyToggleIcon = document.getElementById('adminKeyToggleIcon');

        function showAdminKeyError(message) {
            if (!adminKeyErrorEl) return;
            adminKeyErrorEl.textContent = message;
            adminKeyErrorEl.style.display = 'block';
        }

        function clearAdminKeyError() {
            if (!adminKeyErrorEl) return;
            adminKeyErrorEl.textContent = '';
            adminKeyErrorEl.style.display = 'none';
        }

        function showLoginUI() {
            if (loginContainerEl) loginContainerEl.style.display = 'block';
            if (adminKeyOverlayEl) {
                adminKeyOverlayEl.style.display = 'none';
                adminKeyOverlayEl.setAttribute('aria-hidden', 'true');
            }
        }

        function showAdminKeyOverlay() {
            if (!adminKeyOverlayEl) return;
            adminKeyOverlayEl.style.display = 'flex';
            adminKeyOverlayEl.setAttribute('aria-hidden', 'false');
            setTimeout(() => adminKeyInputEl && adminKeyInputEl.focus(), 0);
        }

        async function verifyAdminEntryKeyFromOverlay() {
            clearAdminKeyError();
            const key = (adminKeyInputEl && adminKeyInputEl.value) ? adminKeyInputEl.value.trim() : '';
            if (!key) {
                showAdminKeyError('Subscriber ID is required.');
                return;
            }

            adminKeyUnlockBtn.disabled = true;
            adminKeyUnlockBtn.innerHTML = '<span class="spinner"></span> Verifying...';

            try {
                const res = await fetch('/api/settings/verify-entry-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ adminEntryKey: key })
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok && data && data.success) {
                    // Store keyToken for login request (serverless-compatible).
                    // sessionStorage keeps it scoped to this tab so it is never cached.
                    if (data.keyToken) {
                        try { sessionStorage.setItem('adminKeyToken', data.keyToken); } catch (_) { }
                    }
                    // Verified: allow access to login page
                    showLoginUI();
                    return;
                }

                adminKeyInputEl.value = '';
                showAdminKeyError('Invalid Subscriber ID.');
            } catch (e) {
                console.error('Admin key verification failed:', e);
                showAdminKeyError('Could not verify Subscriber ID. Please try again.');
            } finally {
                adminKeyUnlockBtn.disabled = false;
                adminKeyUnlockBtn.textContent = 'Unlock';
            }
        }

        async function enforceAdminKeyGateForLogin() {
            try {
                // Check if the server session already has admin-key verified (for local sessions)
                const res = await fetch('/api/settings/check-admin-key-verified', { credentials: 'include' });
                const data = await res.json().catch(() => ({}));
                if (data && data.verified) {
                    showLoginUI();
                    return;
                }
            } catch (e) {
                console.error('check-admin-key-verified failed:', e);
                // fallthrough to showing overlay
            }

            // Not verified -> show the overlay gate which will call /api/settings/verify-entry-key
            showAdminKeyOverlay();
        }

        if (adminKeyUnlockBtn) adminKeyUnlockBtn.addEventListener('click', verifyAdminEntryKeyFromOverlay);
        if (adminKeyCancelBtn) adminKeyCancelBtn.addEventListener('click', () => window.location.href = '/');
        if (adminKeyInputEl) adminKeyInputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') verifyAdminEntryKeyFromOverlay();
        });

        if (adminKeyToggleBtn && adminKeyInputEl) {
            adminKeyToggleBtn.addEventListener('click', () => {
                const isPassword = adminKeyInputEl.getAttribute('type') === 'password';
                adminKeyInputEl.setAttribute('type', isPassword ? 'text' : 'password');
                adminKeyToggleBtn.setAttribute('aria-label', isPassword ? 'Hide subscriber ID' : 'Show subscriber ID');
                adminKeyToggleBtn.title = isPassword ? 'Hide' : 'Show';

                // Swap icon (eye vs eye-off)
                if (!adminKeyToggleIcon) return;
                if (isPassword) {
                    adminKeyToggleIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                } else {
                    adminKeyToggleIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
                }
            });
        }

        // Start the gate immediately
        enforceAdminKeyGateForLogin();

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const googleBtn = document.getElementById('googleBtn');
        const errorMessage = document.getElementById('errorMessage');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        const forgotPasswordContainer = document.getElementById('forgotPasswordContainer');
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const backToLoginLink = document.getElementById('backToLoginLink');
        const resetEmail = document.getElementById('resetEmail');
        const resetBtn = document.getElementById('resetBtn');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        // ── Inline field validation helpers ──
        function setFieldError(groupId, message) {
            const group = document.getElementById(groupId);
            if (!group) return false;
            group.classList.add('has-error');
            const el = group.querySelector('.field-error');
            if (el) el.textContent = message;
            return false;
        }

        function clearFieldErrors(formEl) {
            if (!formEl) return;
            formEl.querySelectorAll('.form-group.has-error').forEach(g => {
                g.classList.remove('has-error');
                const el = g.querySelector('.field-error');
                if (el) el.textContent = '';
            });
        }

        function shakeContainer() {
            const container = document.getElementById('loginContainer');
            if (!container) return;
            container.classList.remove('shake');
            // force reflow so the animation restarts
            void container.offsetWidth;
            container.classList.add('shake');
        }

        // Official 4-color Google "G" logo (brand guideline colors)
        const GOOGLE_LOGO_SVG = `
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>`;

        // Handle form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            clearFieldErrors(loginForm);

            const rememberChecked = document.getElementById('rememberMe').checked;
            const usernameField = document.getElementById('username');
            const passwordField = document.getElementById('password');
            const username = usernameField.value.trim();
            const password = passwordField.value.trim();

            let valid = true;
            if (!username) valid = setFieldError('usernameGroup', 'Please enter your username');
            if (!password) valid = setFieldError('passwordGroup', 'Please enter your password');
            if (!valid) { shakeContainer(); usernameField.focus(); return; }

            try {
                if (rememberChecked) {
                    try { localStorage.setItem('rememberedUsername', username); } catch (_) { }
                } else {
                    try { localStorage.removeItem('rememberedUsername'); } catch (_) { }
                }
            } catch (_) { }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Signing in...';

            try {
                const keyToken = sessionStorage.getItem('adminKeyToken');
                const loginPayload = { username, password };
                if (keyToken) loginPayload.keyToken = keyToken;
                
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(loginPayload),
                    credentials: 'include'
                });

                let data;
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    console.error('Non-JSON response:', text);
                    showError(response.status === 504 ? 'Server timeout. Please try again.' : 'Server returned an unexpected response.');
                    return;
                }

                if (data.success) {
                    // Persist JWT token in sessionStorage only (per-tab, cleared on tab close)
                    try { sessionStorage.setItem('authToken', data.token || ''); } catch (_) { }
                    // Clear any stored admin key token (no longer needed) and redirect
                    try { sessionStorage.removeItem('adminKeyToken'); } catch (_) {}
                    window.location.href = '/admin.html';
                } else {
                    showError(data.error || 'Login failed');
                    shakeContainer();
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('An error occurred. Please try again.');
                shakeContainer();
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>Sign In</span>';
            }
        });

        // Handle Google login callback
        async function handleSignInResponse(response) {
            hideError();
            googleBtn.disabled = true;
            googleBtn.innerHTML = '<span class="spinner" style="border-color: rgba(0,0,0,0.2); border-top-color: #333;"></span> Signing in...';

            try {
                const keyToken = sessionStorage.getItem('adminKeyToken');
                const authResponse = await fetch('/auth/google', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ credential: response.credential, keyToken }),
                    credentials: 'include'
                });

                const data = await authResponse.json();

                if (data.success) {
                    try { sessionStorage.setItem('authToken', data.token || ''); } catch (_) { }
                    try { sessionStorage.removeItem('adminKeyToken'); } catch (_) {}
                    window.location.href = '/admin.html';
                } else {
                    showError(data.error || 'Google login failed');
                    shakeContainer();
                    googleBtn.disabled = false;
                    googleBtn.innerHTML = `${GOOGLE_LOGO_SVG}
                        Sign in with Google
                    `;
                }
            } catch (error) {
                console.error('Google login error:', error);
                showError('An error occurred. Please try again.');
                shakeContainer();
                googleBtn.disabled = false;
                googleBtn.innerHTML = `${GOOGLE_LOGO_SVG}
                    Sign in with Google
                `;
            }
        }

        // Initialize Google Sign-In once
        let googleSignInInitialized = false;
        let googleClientIdPromise = null;
        // Legacy fallback (kept only if the config endpoint is unreachable)
        const FALLBACK_GOOGLE_CLIENT_ID = '338774598801-rmbjl0aprte0l23ja5u3t3fm222jkbq1.apps.googleusercontent.com';

        function getGoogleClientId() {
            if (!googleClientIdPromise) {
                googleClientIdPromise = fetch('/api/auth/google-client', { credentials: 'same-origin' })
                    .then(r => (r.ok ? r.json() : null))
                    .then(d => (d && d.clientId) ? d.clientId : '')
                    .catch(() => FALLBACK_GOOGLE_CLIENT_ID);
            }
            return googleClientIdPromise;
        }

        async function initGoogleSignIn() {
            if (googleSignInInitialized) return true;
            if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) return false;

            const clientId = await getGoogleClientId();
            if (!clientId) return false;
            if (googleSignInInitialized) return true;

            google.accounts.id.initialize({
                client_id: clientId,
                callback: handleSignInResponse,
                auto_select: false,
                cancel_on_tap_outside: false
            });
            googleSignInInitialized = true;
            return true;
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => { initGoogleSignIn().catch(() => {}); });
        } else {
            initGoogleSignIn().catch(() => {});
        }

        // Handle Google sign-in button click
        googleBtn.addEventListener('click', async () => {
            hideError();
            if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
                showError('Google Sign-In is loading. Please wait and try again.');
                return;
            }
            const ready = await initGoogleSignIn();
            if (!ready) {
                showError('Google Sign-In is not configured on this server.');
                return;
            }
            google.accounts.id.prompt();
        });

        // Handle password toggle
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');

        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Dynamic tooltip + accessible name (mirrors the admin-key toggle)
            passwordToggle.setAttribute('aria-label', type === 'password' ? 'Show password' : 'Hide password');
            passwordToggle.title = type === 'password' ? 'Show password' : 'Hide password';

            // Update icon
            const icon = passwordToggle.querySelector('#passwordToggleIcon');
            if (type === 'password') {
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            } else {
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            }
        });

        // Handle forgot password link
        forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            hideError();
            loginForm.style.display = 'none';
            forgotPasswordForm.style.display = 'block';
            forgotPasswordContainer.style.display = 'none';
            resetEmail.focus();
        });

        // Handle back to login link
        backToLoginLink.addEventListener('click', (e) => {
            e.preventDefault();
            hideError();
            forgotPasswordForm.style.display = 'none';
            loginForm.style.display = 'flex';
            forgotPasswordContainer.style.display = 'block';
            document.getElementById('username').focus();
        });

        // Handle reset password form submission
        forgotPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            clearFieldErrors(forgotPasswordForm);

            const email = resetEmail.value.trim();

            if (!email) {
                setFieldError('resetEmailGroup', 'Please enter your email address');
                resetEmail.focus();
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                setFieldError('resetEmailGroup', 'Please enter a valid email address');
                resetEmail.focus();
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Sending...';

            try {
                const response = await fetch('/auth/forgot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });

                const data = await response.json();

                if (data.success) {
                    showError('Password reset email sent. Check your inbox.');
                    resetEmail.value = '';
                } else {
                    showError(data.error || 'Failed to send reset email');
                }
            } catch (error) {
                console.error('Forgot password error:', error);
                showError('An error occurred. Please try again.');
            } finally {
                resetBtn.disabled = false;
                resetBtn.textContent = 'Send Reset Email';
            }
        });

        // Focus on username field, prefill remembered username, spellcheck off
        document.addEventListener('DOMContentLoaded', () => {
            const usernameField = document.getElementById('username');
            try {
                const remembered = localStorage.getItem('rememberedUsername');
                if (remembered) {
                    usernameField.value = remembered;
                    document.getElementById('rememberMe').checked = true;
                }
            } catch (_) { }
            usernameField.focus();
        });

        // ── Login Mode Toggle (Admin vs License) ──
        function switchLoginMode(mode) {
            const adminForm = document.getElementById('loginForm');
            const licenseForm = document.getElementById('licenseLoginForm');
            const adminBtn = document.getElementById('adminModeBtn');
            const licenseBtn = document.getElementById('licenseModeBtn');
            const forgotContainer = document.getElementById('forgotPasswordContainer');
            const divider = document.getElementById('signInDivider');
            const googleBtn = document.getElementById('googleBtn');
            const toggle = document.getElementById('loginModeToggle');
            hideError();
            clearFieldErrors(adminForm);
            clearFieldErrors(licenseForm);

            if (mode === 'license') {
                adminForm.classList.add('hidden');
                licenseForm.classList.add('visible');
                adminBtn.classList.remove('active');
                licenseBtn.classList.add('active');
                toggle.classList.add('license');
                if (forgotContainer) forgotContainer.parentElement.style.display = 'none';
                if (divider) divider.style.display = 'none';
                if (googleBtn) googleBtn.style.display = 'none';
                setTimeout(() => document.getElementById('licenseEmail').focus(), 60);
            } else {
                adminForm.classList.remove('hidden');
                licenseForm.classList.remove('visible');
                adminBtn.classList.add('active');
                licenseBtn.classList.remove('active');
                toggle.classList.remove('license');
                if (forgotContainer) forgotContainer.parentElement.style.display = '';
                if (divider) divider.style.display = '';
                if (googleBtn) googleBtn.style.display = '';
                setTimeout(() => document.getElementById('username').focus(), 60);
            }
        }

        // License login form submission
        const licenseLoginForm = document.getElementById('licenseLoginForm');
        if (licenseLoginForm) {
            licenseLoginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();
                clearFieldErrors(licenseLoginForm);
                const licenseEmailField = document.getElementById('licenseEmail');
                const licenseKeyField = document.getElementById('licenseKey');
                const email = licenseEmailField.value.trim();
                const licenseKey = licenseKeyField.value.trim().toUpperCase();
                const btn = document.getElementById('licenseLoginBtn');

                let valid = true;
                if (!email) valid = setFieldError('licenseEmailGroup', 'Please enter your email address');
                if (!licenseKey) valid = setFieldError('licenseKeyGroup', 'Please enter your license key');
                if (!valid) { shakeContainer(); licenseEmailField.focus(); return; }

                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Verifying...';
                try {
                    const resp = await fetch('/auth/license-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ email, licenseKey })
                    });
                    const data = await resp.json();
                    if (data.success) {
                        try { sessionStorage.setItem('authToken', data.token || ''); } catch (_) {}
                        window.location.href = '/admin.html';
                    } else {
                        showError(data.message || data.error || 'License verification failed.');
                        shakeContainer();
                    }
                } catch (err) {
                    showError('An error occurred. Please try again.');
                    shakeContainer();
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<span>Activate with License</span>';
                }
            });
        }
    </script>
</body>

</html>
