<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site not found</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #faf9f7; color: #171715;
    }
    main { max-width: 440px; padding: 32px 24px; text-align: center; }
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 16px;
      background: #171715; color: #faf9f7; font-size: 26px; font-weight: 700;
      margin-bottom: 20px;
    }
    h1 { font-size: 28px; line-height: 1.2; margin: 0 0 10px; letter-spacing: -0.02em; }
    p { margin: 0 0 8px; color: #5f5e57; line-height: 1.6; font-size: 15px; }
    a { color: #d0271c; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      body { background: #111110; color: #f3f2ee; }
      p { color: #a5a49c; }
      .badge { background: #f3f2ee; color: #111110; }
    }
  </style>
</head>
<body>
  <main>
    <div class="badge" aria-hidden="true">?</div>
    <h1>Site not found</h1>
    <p>There is no blog configured for this address. Check the URL, or contact the person who shared it with you.</p>
  </main>
</body>
</html>
